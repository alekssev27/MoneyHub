name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config m4 zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache wget

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install "sh==1.14.3"
          pip install buildozer==1.4.0
          pip install cython==0.29.36
          pip install "python-for-android==2023.9.16" --no-deps
          pip install appdirs colorama jinja2 meson ninja build toml packaging setuptools "wheel==0.43.0"

      - name: Pre-create directories
        run: |
          mkdir -p ~/.buildozer/android/platform
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p ~/.buildozer/android/packages

      - name: Setup Android SDK licenses
        run: |
          SDK=~/.buildozer/android/platform/android-sdk
          mkdir -p "$SDK/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK/licenses/android-sdk-preview-license"

      - name: Download and install Android SDK
        run: |
          SDK=~/.buildozer/android/platform/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mkdir -p "$SDK/cmdline-tools/latest"
          cp -r cmdline-tools/* "$SDK/cmdline-tools/latest/"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root=$SDK --licenses || true
          sdkmanager --sdk_root=$SDK "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager" || true
          ln -sf "$SDK/cmdline-tools/latest/bin/avdmanager" "$SDK/tools/bin/avdmanager" || true

      - name: Download Android NDK r25b
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip -d ~/.buildozer/android/platform/
          ls ~/.buildozer/android/platform/ | grep ndk

      - name: Clone p4a 2023.09.16
        run: |
          git clone --depth 1 --branch 2023.09.16 \
            https://github.com/kivy/python-for-android.git \
            ~/.buildozer/android/platform/python-for-android
          cd ~/.buildozer/android/platform/python-for-android
          git log --oneline -1

      - name: Patch freetype recipe URL
        run: |
          RECIPE=~/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/freetype/__init__.py
          if [ -f "$RECIPE" ]; then
            echo "Before patch:"
            grep -i "savannah\|url" "$RECIPE" | head -5
            sed -i 's|https://download.savannah.gnu.org/releases/freetype/|https://mirror.init7.net/gnu/freetype/|g' "$RECIPE"
            echo "After patch:"
            grep -i "mirror\|url" "$RECIPE" | head -5
          else
            echo "Recipe not found at $RECIPE"
            find ~/.buildozer/android/platform/python-for-android -name "__init__.py" | xargs grep -l "freetype" 2>/dev/null | head -3
          fi

      - name: Create buildozer.spec
        run: |
          python3 - << 'PYEOF'
          content = """[app]
title = MoneyHub
package.name = moneyhub
package.domain = org.alekssev27
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,json,ttf
version = 1.0
requirements = python3,kivy==2.3.0,kivymd==1.2.0,pillow==10.2.0
orientation = portrait
fullscreen = 0

[buildozer]
log_level = 2
warn_on_root = 0

android.api = 33
android.minapi = 21
android.ndk = 25b
android.archs = arm64-v8a
android.accept_sdk_license = True
android.sdk_path = /home/runner/.buildozer/android/platform/android-sdk
android.ndk_path = /home/runner/.buildozer/android/platform/android-ndk-r25b
p4a.source_dir = /home/runner/.buildozer/android/platform/python-for-android
"""
          with open("buildozer.spec", "w") as f:
              f.write(content)
          print("buildozer.spec created successfully")
          PYEOF

      - name: Show buildozer.spec
        run: cat buildozer.spec

      - name: Build APK
        run: buildozer android debug 2>&1
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r25b
        timeout-minutes: 90

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyHub-APK
          path: bin/*.apk
          if-no-files-found: warn
