name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Устанавливаем системные зависимости
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      # 4. Устанавливаем buildozer и зафиксированный python-for-android
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36
          pip install git+https://github.com/kivy/python-for-android.git@v2024.01.21

      # 5. Принимаем лицензии Android SDK заранее
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT || true
          yes | sdkmanager --licenses || true

      # 6. Собираем APK (debug-версию)
      - name: Build APK with buildozer
        run: |
          buildozer android debug
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      # 7. Загружаем готовый APK как артефакт
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyHub-APK
          path: bin/*.apk
